name: Prepara copertine e anteprime social
on:
  push:
    branches: [main]
    paths:
      - 'images/**'
      - '*.PNG'
      - '*.png'
      - '*.jpg'
      - '*.jpeg'
      - '*.webp'
      - '*.JPG'
      - '*.JPEG'
      - '*.WEBP'
      - '*.avif'
      - 'scripts/prepare_images.py'
      - 'scripts/check_covers.py'
      - '.github/workflows/prepare-covers.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prepare-covers
  cancel-in-progress: true

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0 PyYAML==6.0.2
      - name: Genera immagini senza tagli
        run: python scripts/prepare_images.py
      - name: Controlla formati e manifest
        run: python scripts/check_covers.py
      - name: Salva copertine ottimizzate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/covers assets/brand _data/images.json favicon-48x48.png favicon-192x192.png favicon-512x512.png favicon.ico apple-touch-icon.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Ottimizza copertine e anteprime social automaticamente'
          git pull --rebase origin main
          git push origin HEAD:main
