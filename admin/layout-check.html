<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verifica layout — Nicklas News</title><style>body{margin:0;background:#17202c;color:#fff;font:16px Arial}header{padding:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}button,select{font:inherit;min-height:44px;padding:8px}main{overflow:auto;padding:12px}iframe{border:0;height:850px;background:#050a11;display:block}label{display:flex;align-items:center;gap:8px}</style></head><body><header><strong>Verifica layout</strong><label>Larghezza <select id="width"><option>320</option><option>360</option><option selected>390</option><option>430</option><option>768</option><option>1024</option><option>1440</option><option>1920</option></select></label><button data-path="/">Homepage</button><button data-path="/notizie/italia-francia-nicklas/">Articolo recente</button><button data-path="/chi-siamo/">Chi siamo</button><span id="result" role="status"></span></header><main><iframe id="preview" title="Anteprima sito" src="/" style="width:390px"></iframe></main><script>const frame=document.getElementById('preview'),width=document.getElementById('width'),result=document.getElementById('result');function measure(){const doc=frame.contentDocument;result.textContent=doc.documentElement.scrollWidth>doc.documentElement.clientWidth?'Overflow orizzontale rilevato':'Nessun overflow orizzontale';}width.onchange=()=>{frame.style.width=width.value+'px';requestAnimationFrame(measure)};document.querySelectorAll('[data-path]').forEach(button=>button.onclick=()=>{frame.src=button.dataset.path});frame.onload=()=>{measure();new ResizeObserver(measure).observe(frame.contentDocument.body);};</script></body></html>
