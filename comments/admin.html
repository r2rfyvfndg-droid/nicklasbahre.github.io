<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moderazione commenti — Nicklas News</title><style>body{margin:0 auto;max-width:760px;padding:30px 18px;background:#050a11;color:#f4f8fc;font:16px/1.5 Arial,sans-serif}input,button{padding:12px;font:inherit}input{width:min(100%,440px)}li{padding:18px 0;border-bottom:1px solid #29415a}button{margin:5px;cursor:pointer}a{color:#8bdcff}</style></head><body><h1>Moderazione commenti</h1><p>Inserisci il token amministratore. Rimane solo in questa pagina finché è aperta.</p><label>Token <input id="token" type="password" autocomplete="off"></label><button id="load" type="button">Carica commenti in attesa</button><p id="status" role="status"></p><ul id="comments"></ul><script>
const token=document.getElementById('token'), list=document.getElementById('comments'), status=document.getElementById('status');
async function api(method, body){const response=await fetch('/api/comments/moderate',{method,headers:{Authorization:`Bearer ${token.value}`,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});if(!response.ok)throw new Error('Accesso o richiesta non riuscita');return response.json()}
async function load(){try{const data=await api('GET');list.replaceChildren();for(const comment of data.comments){const li=document.createElement('li'),title=document.createElement('strong'),p=document.createElement('p');title.textContent=`#${comment.id} · ${comment.nickname} · ${comment.article}`;p.textContent=comment.body;li.append(title,p);for(const [label,value] of [['Approva','approved'],['Rifiuta','rejected']]){const button=document.createElement('button');button.textContent=label;button.onclick=async()=>{try{await api('POST',{id:comment.id,status:value});li.remove();status.textContent='Commento aggiornato.'}catch(e){status.textContent=e.message}};li.append(button)}list.append(li)}status.textContent=data.comments.length?'':'Nessun commento in attesa.'}catch(e){status.textContent=e.message}}
document.getElementById('load').onclick=load;
</script></body></html>
